<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photographie — Laurelli_prod</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a08;
  --surface: #111110;
  --surface2: #1a1a18;
  --accent: #c8a96e;
  --accent2: #e8d5b0;
  --text: #f0ece4;
  --muted: #8a8880;
  --border: rgba(200,169,110,0.22);
  --font-display: 'Cormorant Garamond', serif;
  --font-mono: 'DM Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-mono);
  overflow-x: hidden;
  cursor: crosshair;
}

a { color: inherit; text-decoration: none; }

/* ── NAV MINIMALISTE ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.5rem 3rem;
  pointer-events: none;
}

nav > * { pointer-events: auto; }

.nav-logo {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 300;
  letter-spacing: 0.15em;
  color: var(--accent);
  font-style: italic;
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.nav-btn {
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  border: 1px solid var(--border);
  background: rgba(10,10,8,0.75);
  backdrop-filter: blur(6px);
  color: var(--muted);
  padding: 0.5rem 1.2rem;
  transition: all 0.3s;
}

.nav-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.nav-btn.primary {
  border-color: var(--accent);
  color: var(--accent);
}

.nav-btn.primary:hover {
  background: var(--accent);
  color: var(--bg);
}

/* ── TRACK DE SCROLL (HAUTEUR CALCULÉE EN JS SELON LE NOMBRE DE PHOTOS) ── */
#scroll-track {
  position: relative;
  width: 100%;
}

/* ── SCÈNE FIXE PLEIN ÉCRAN PILOTÉE PAR LE SCROLL ── */
#viewport-stage {
  position: sticky;
  top: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1400px;
  background: radial-gradient(circle at 50% 50%, #141310 0%, #0a0a08 75%);
}

/* Viseur discret aux coins */
.hud-corner {
  position: fixed;
  width: 16px;
  height: 16px;
  border-color: rgba(200,169,110,0.35);
  border-style: solid;
  pointer-events: none;
  z-index: 40;
}
.hud-tl { top: 5.5rem; left: 3rem; border-width: 1px 0 0 1px; }
.hud-tr { top: 5.5rem; right: 3rem; border-width: 1px 1px 0 0; }
.hud-bl { bottom: 5.5rem; left: 3rem; border-width: 0 0 1px 1px; }
.hud-br { bottom: 5.5rem; right: 3rem; border-width: 0 1px 1px 0; }

/* ── SLIDES PHOTO 3D ── */
.photo-slide {
  position: absolute;
  width: min(76vw, 1080px);
  height: min(64vh, 660px);
  display: flex;
  align-items: center;
  justify-content: center;
  will-change: transform, opacity, filter;
  transform-style: preserve-3d;
  cursor: pointer;
}

.photo-slide.portrait {
  width: min(44vw, 480px);
  height: min(68vh, 680px);
}

.photo-card {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border: 1px solid rgba(200,169,110,0.25);
  background: var(--surface2);
  box-shadow: 0 30px 90px rgba(0,0,0,0.85);
}

.photo-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Placeholder visuel */
.photo-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  background: linear-gradient(145deg, #1b1a16 0%, #0e0e0c 100%);
  color: var(--muted);
}

  font-size: 4rem;
