<style>
:root {
  --bg: #0a0a08;
  --surface: #111110;
  --surface2: #1a1a18;
  --accent: #c8a96e;
  --accent2: #e8d5b0;
  --text: #f0ece4;
  --muted: #8a8880;
  --border: rgba(200,169,110,0.2);
  --font-display: 'Cormorant Garamond', serif;
  --font-mono: 'DM Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.7;
  overflow-x: hidden;
  cursor: crosshair;
}

a { color: inherit; text-decoration: none; }

/* ── GRAIN PELLICULE SUBTIL ── */
.film-grain {
  position: fixed;
  inset: 0;
  pointer-events: none
